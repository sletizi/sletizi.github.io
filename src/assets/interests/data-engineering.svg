<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img">
  <!--
    Data Engineering - illustrazione originale, stessa palette e stesse regole
    di business-intelligence.svg: contenuto dentro x 230-980 / y 140-460 (la
    zona che sopravvive a entrambi i ritagli di v-img), fondo libero di
    riempire i bordi. Tre sorgenti -> piattaforma -> consumo a valle.
  -->
  <defs>
    <pattern id="de-dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#A1A499" opacity="0.28" />
    </pattern>

    <filter id="de-card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A4F4C" flood-opacity="0.13" />
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="600" fill="#DAD6CC" />
  <rect width="1200" height="600" fill="url(#de-dots)" />
  <circle cx="86" cy="300" r="160" fill="#5B879B" opacity="0.10" />
  <circle cx="1122" cy="168" r="128" fill="#BFA89E" opacity="0.22" />
  <circle cx="1080" cy="486" r="74" fill="#5B879B" opacity="0.12" />

  <g transform="translate(600 300) scale(0.92) translate(-605 -300)">

    <!-- condotti: disegnati per primi, cosi' passano sotto a database e card -->
    <g fill="none" stroke="#5B879B" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <path d="M335 190 C420 190 430 272 515 272" />
      <path d="M335 300 H515" />
      <path d="M335 410 C420 410 430 328 515 328" />
      <path d="M705 285 C740 285 752 240 795 240" />
      <path d="M705 315 C740 315 752 395 795 395" />
    </g>
    <g fill="#5B879B">
      <circle cx="425" cy="219" r="4.5" />
      <circle cx="425" cy="300" r="4.5" />
      <circle cx="425" cy="381" r="4.5" />
      <circle cx="750" cy="258" r="4.5" />
      <circle cx="750" cy="352" r="4.5" />
    </g>

    <!-- ===== sorgenti: tre database ===== -->
    <g transform="translate(285 190)">
      <path d="M-45 -22 V22 A45 14 0 0 0 45 22 V-22 Z" fill="#A8C1CD" />
      <ellipse cx="0" cy="-22" rx="45" ry="14" fill="#C9DBE4" />
      <path d="M-45 0 A45 14 0 0 0 45 0" fill="none" stroke="#FBFAF8" stroke-width="2.5" opacity="0.8" />
    </g>
    <g transform="translate(285 300)">
      <path d="M-45 -22 V22 A45 14 0 0 0 45 22 V-22 Z" fill="#A8C1CD" />
      <ellipse cx="0" cy="-22" rx="45" ry="14" fill="#C9DBE4" />
      <path d="M-45 0 A45 14 0 0 0 45 0" fill="none" stroke="#FBFAF8" stroke-width="2.5" opacity="0.8" />
    </g>
    <g transform="translate(285 410)">
      <path d="M-45 -22 V22 A45 14 0 0 0 45 22 V-22 Z" fill="#A8C1CD" />
      <ellipse cx="0" cy="-22" rx="45" ry="14" fill="#C9DBE4" />
      <path d="M-45 0 A45 14 0 0 0 45 0" fill="none" stroke="#FBFAF8" stroke-width="2.5" opacity="0.8" />
    </g>

    <!-- ===== piattaforma: i tre strati di raffinazione del dato ===== -->
    <g filter="url(#de-card-shadow)">
      <rect x="520" y="225" width="180" height="150" rx="16" fill="#FBFAF8" />
    </g>
    <rect x="550" y="248" width="72" height="10" rx="5" fill="#A1A499" />
    <rect x="550" y="274" width="120" height="18" rx="9" fill="#BFA89E" />
    <rect x="550" y="300" width="120" height="18" rx="9" fill="#A8C1CD" />
    <rect x="550" y="326" width="120" height="18" rx="9" fill="#5B879B" />

    <!-- ===== a valle: un grafico e una tabella ===== -->
    <g filter="url(#de-card-shadow)">
      <rect x="800" y="175" width="180" height="130" rx="16" fill="#FBFAF8" />
    </g>
    <rect x="825" y="198" width="66" height="9" rx="4.5" fill="#A1A499" />
    <g>
      <rect x="825" y="248" width="20" height="34" rx="4" fill="#A8C1CD" />
      <rect x="855" y="228" width="20" height="54" rx="4" fill="#A8C1CD" />
      <rect x="885" y="240" width="20" height="42" rx="4" fill="#A8C1CD" />
      <rect x="915" y="214" width="20" height="68" rx="4" fill="#5B879B" />
      <rect x="945" y="226" width="20" height="56" rx="4" fill="#A8C1CD" />
    </g>

    <g filter="url(#de-card-shadow)">
      <rect x="800" y="330" width="180" height="130" rx="16" fill="#FBFAF8" />
    </g>
    <g>
      <rect x="825" y="358" width="48" height="9" rx="4.5" fill="#4A4F4C" opacity="0.45" />
      <rect x="885" y="358" width="70" height="9" rx="4.5" fill="#A1A499" opacity="0.85" />
      <rect x="825" y="382" width="48" height="9" rx="4.5" fill="#4A4F4C" opacity="0.45" />
      <rect x="885" y="382" width="56" height="9" rx="4.5" fill="#A1A499" opacity="0.85" />
      <rect x="825" y="406" width="48" height="9" rx="4.5" fill="#4A4F4C" opacity="0.45" />
      <rect x="885" y="406" width="70" height="9" rx="4.5" fill="#A1A499" opacity="0.85" />
      <rect x="825" y="430" width="48" height="9" rx="4.5" fill="#4A4F4C" opacity="0.45" />
      <rect x="885" y="430" width="44" height="9" rx="4.5" fill="#A1A499" opacity="0.85" />
    </g>
  </g>
</svg>
